name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer ModelForge et les dépendances de test
        run: python -m pip install -e ".[dev]"

      - name: Exécuter la suite complète
        run: python -m pytest

      - name: Vérifier la compilation Python
        run: python -m compileall -q modelforge tests

      - name: Vérifier le contrat OpenAPI statique
        run: >-
          python -c "import pathlib,yaml; d=yaml.safe_load(pathlib.Path('contracts/openapi.yaml').read_text());
          assert d['openapi']=='3.1.0'; assert d['info']['version']=='1.0.6';
          assert '/performance-drift-dossiers' in d['paths']"
